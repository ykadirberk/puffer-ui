name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install clang-format
        run: pip install clang-format==22.1.3

      - name: Format check (everything tracked, vendored excluded)
        shell: bash
        run: |
          clang-format --dry-run --Werror $(git ls-files '*.h' '*.cpp' '*.inl' ':!:vendored')

      - name: API reference drift check
        shell: pwsh
        run: tools/gen_api.ps1 -Check

      - name: Tutorial snippets match their sources
        shell: pwsh
        run: tools/check_tutorial.ps1

      - name: Configure (debug)
        run: cmake --preset x64-debug

      - name: Build (debug)
        run: cmake --build out/build/x64-debug

      - name: Core tests
        run: out/build/x64-debug/Debug/pui_core_tests.exe

      - name: Performance regressions (debug)
        run: out/build/x64-debug/Debug/pui_perf_tests.exe

      - name: Performance pixel baselines (debug)
        run: out/build/x64-debug/Debug/pui_perf_pixels.exe

      - name: Showcase regressions and Spiral goldens (debug)
        run: |
          out/build/x64-debug/Debug/pui_showcase_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/build/x64-debug/Debug/pui_showcase_tests.exe --pixels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/build/x64-debug/Debug/pui_showcase_tests.exe --pixels --tiles 5000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/build/x64-debug/Debug/pui_showcase_tests.exe --peak-pixels

      - name: Pump tests
        run: out/build/x64-debug/Debug/pui_pump_tests.exe

      - name: Golden-image tests
        run: out/build/x64-debug/Debug/pui_golden_tests.exe

      - name: Example selftests (offscreen)
        run: cmake --build out/build/x64-debug --target examples_selftest

      - name: External CMake consumers
        run: python tools/check_consumers.py --sdl-build out/build/x64-debug

      - name: Configure (release)
        run: cmake --preset x64-release

      - name: Build (release)
        run: cmake --build out/build/x64-release

      - name: Core tests (release)
        run: out/build/x64-release/Release/pui_core_tests.exe

      - name: Performance regressions (release)
        run: out/build/x64-release/Release/pui_perf_tests.exe

      - name: Performance pixel baselines (release)
        run: out/build/x64-release/Release/pui_perf_pixels.exe

      - name: Showcase regressions and Spiral goldens (release)
        run: |
          out/build/x64-release/Release/pui_showcase_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/build/x64-release/Release/pui_showcase_tests.exe --pixels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/build/x64-release/Release/pui_showcase_tests.exe --pixels --tiles 5000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/build/x64-release/Release/pui_showcase_tests.exe --peak-pixels

      - name: Pump tests (release)
        run: out/build/x64-release/Release/pui_pump_tests.exe

      - name: Golden-image tests (release)
        run: out/build/x64-release/Release/pui_golden_tests.exe

      - name: Upload golden dumps on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-dumps
          path: tests/golden/dump

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain + SDL build deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y ninja-build clang
          libasound2-dev libpulse-dev libx11-dev libxcursor-dev libxrandr-dev
          libxi-dev libxext-dev libxfixes-dev libwayland-dev libxkbcommon-dev
          libegl1-mesa-dev

      - name: Configure (${{ matrix.compiler }}, warnings + sanitizers)
        run: >
          cmake -B out/build/linux -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DPUFFERUI_SANITIZERS=ON
          -DCMAKE_C_COMPILER=${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

      - name: Build (headless: core tests + bench)
        run: cmake --build out/build/linux --target pui_core_tests pui_perf_tests pui_bench

      - name: Core tests (ASan + UBSan)
        run: >
          out/build/linux/Debug/pui_core_tests &&
          out/build/linux/Debug/pui_perf_tests &&
          out/build/linux/Debug/pui_core_tests --filter keyboard &&
          out/build/linux/Debug/pui_core_tests --filter virtual_list

      - name: Build (SDL targets — first Linux bring-up: proves the GNUC paths compile)
        run: cmake --build out/build/linux --target pui_ex_hello pui_ex_headless

      - name: SDL offscreen suites
        run: >
          cmake --build out/build/linux --target pui_pump_tests pui_golden_tests pui_perf_pixels pui_showcase_tests &&
          out/build/linux/Debug/pui_pump_tests &&
          out/build/linux/Debug/pui_perf_pixels &&
          out/build/linux/Debug/pui_showcase_tests &&
          out/build/linux/Debug/pui_showcase_tests --pixels &&
          out/build/linux/Debug/pui_showcase_tests --pixels --tiles 5000 &&
          out/build/linux/Debug/pui_showcase_tests --peak-pixels &&
          out/build/linux/Debug/pui_golden_tests

      - name: External core consumers
        run: python3 tools/check_consumers.py


      - name: Example selftests (offscreen)
        run: cmake --build out/build/linux --target examples_selftest

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (debug)
        run: cmake -B out/build/macos -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build (core, SDL suites)
        run: cmake --build out/build/macos --target pui_core_tests pui_perf_tests pui_pump_tests pui_golden_tests pui_perf_pixels pui_showcase_tests

      - name: Core tests
        run: out/build/macos/Debug/pui_core_tests && out/build/macos/Debug/pui_perf_tests

      - name: SDL offscreen suites
        run: >
          out/build/macos/Debug/pui_pump_tests &&
          out/build/macos/Debug/pui_golden_tests &&
          out/build/macos/Debug/pui_perf_pixels &&
          out/build/macos/Debug/pui_showcase_tests &&
          out/build/macos/Debug/pui_showcase_tests --pixels &&
          out/build/macos/Debug/pui_showcase_tests --pixels --tiles 5000 &&
          out/build/macos/Debug/pui_showcase_tests --peak-pixels

      - name: Example selftests (offscreen)
        run: cmake --build out/build/macos --target examples_selftest

      - name: External core consumers
        run: python3 tools/check_consumers.py
